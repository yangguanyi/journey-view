<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>行程网页连接测试</title>
<style>
*{box-sizing:border-box}body{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#f5f7f4;color:#20342a;margin:0;padding:32px 20px;line-height:1.75}main{max-width:580px;margin:8vh auto;background:white;border-radius:24px;padding:28px}h1{font-size:26px;margin:0 0 16px}p{margin:12px 0}.result{border-radius:14px;background:#eef4ee;padding:16px}button{font:inherit;background:#225d45;color:white;border:0;border-radius:12px;padding:12px 18px;cursor:pointer}small{color:#59675f;display:block;margin-top:20px}
</style>
<main>
<h1>行程网页连接测试</h1>
<p>如果您能看到这段文字，说明这次已成功打开测试网页。</p>
<p>请在不开 VPN 的情况下，分别用微信和手机浏览器打开这个链接。方便的话，也请分别试一下 Wi-Fi 和手机流量。</p>
<div class="result" id="result" role="status">正在测试是否能获取最新内容……</div>
<p><button type="button" id="check">重新测试连接</button></p>
<small>这只是连接测试，不包含任何行程、照片或个人资料，也不会收集测试结果。请将您看到的结果告诉家人。一次成功不代表今后始终能连接。</small>
</main>
<script>
const output=document.querySelector('#result'),button=document.querySelector('#check');
async function check(){button.disabled=true;output.textContent='正在测试是否能获取最新内容……';const controller=new AbortController();const timeout=setTimeout(()=>controller.abort(),15000);try{const response=await fetch('./connection.json?t='+Date.now(),{cache:'no-store',signal:controller.signal});if(!response.ok)throw Error();const data=await response.json();if(data.test!=='ok')throw Error();output.textContent='连接成功！网页和最新内容均可读取。测试时间：'+new Date().toLocaleString('zh-CN');}catch{output.textContent='网页已打开，但暂时无法获取最新内容。请换用手机流量或 Wi-Fi 后，再点一次“重新测试连接”。';}finally{clearTimeout(timeout);button.disabled=false;}}
button.addEventListener('click',check);check();
</script>
</html>
