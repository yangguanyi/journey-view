<div id="gate" class="gate"><span class="eyebrow">旅途中的一封家书</span><h1>我们的旅程</h1><p id="gate-message">请使用关忆发给您的完整私人链接打开行程。</p><p class="muted">无需登录。这个普通网址不包含查看私人行程的钥匙。</p></div>
<div id="app" hidden><header><div class="head-inner"><span class="eyebrow">一路风景，与你分享</span><h1 id="trip-title"></h1><p id="trip-dates"></p><div class="toolbar"><button id="refresh" type="button">↻ 更新行程</button><button id="today" type="button">回到今天</button><span class="pill">完整行程 · 只读</span></div></div></header>
<main><section class="status-box"><strong id="where"></strong><p id="sync" role="status"></p></section><p id="warning" class="notice" hidden></p>
<nav id="tabs" aria-label="行程分类"></nav><div class="filters"><input id="search" type="search" aria-label="搜索行程" placeholder="搜索城市、活动、酒店或预订信息"><select id="city" aria-label="按城市筛选"><option value="">所有城市</option></select></div><div id="content"></div>
<footer>位置根据行程日期显示，不是实时定位。时间均以活动所在地为准。新的英文内容由关忆安排翻译；待翻译内容会明确标注。预订信息仅供持有私人链接的家人查看。<p>打开或回到此页面时会检查更新；没有每分钟刷新，也不会持续调用定位。常用页面会保存在这台设备上，断网时可查看上次成功读取的行程。</p></footer>
</main></div><script type="module" src="viewer.mjs"></script></body></html>
