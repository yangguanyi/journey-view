name: Refresh encrypted family itinerary
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '2-57/5 * * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: family-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore encrypted photo cache
        uses: actions/cache@v4
        with:
          path: .photo-cache
          key: encrypted-photos-${{ github.sha }}
      - name: Validate mirror privacy and behavior
        run: node --test mirror.test.mjs
      - name: Read encrypted latest itinerary
        run: node sync.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
          retention-days: 1
      - name: Publish latest copy
        id: deployment
        uses: actions/deploy-pages@v4
